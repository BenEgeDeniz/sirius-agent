# Redis configuration for BenEgeDeniz Sirius Agent
# Ephemeral data store — no persistence needed
#
# Template variables (replaced by install.sh):
#   __REDIS_PASSWORD__  — generated during installation

# Process
daemonize no
supervised systemd

# Network
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Authentication
requirepass __REDIS_PASSWORD__

# Memory
maxmemory 64mb
maxmemory-policy allkeys-lru

# Persistence — DISABLED (all tunnel data is ephemeral)
save ""
appendonly no

# Logging — use Redis default log location
loglevel notice
logfile /var/log/redis/sirius-agent.log

# Security — disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Performance
hz 10
dynamic-hz yes
