# BenEgeDeniz Sirius Agent server block
# Handles wildcard subdomain routing for ephemeral tunnels
#
# Template variables (replaced by install.sh):
#   __BASE_DOMAIN__    - e.g., agent.example.com
#   __UPSTREAM_URL__   - e.g., https://upstream-server:8443

# HTTP → HTTPS redirect for tunnel subdomains
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>[a-z0-9][a-z0-9-]*[a-z0-9])\.(__BASE_DOMAIN__|__BASE_DOMAIN_ESCAPED__)$;

    # Allow ACME challenges for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS sirius agent
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<subdomain>[a-z0-9][a-z0-9-]*[a-z0-9])\.(__BASE_DOMAIN__|__BASE_DOMAIN_ESCAPED__)$;

    # TLS certificate (wildcard)
    ssl_certificate /etc/sirius-agent/tls/fullchain.pem;
    ssl_certificate_key /etc/sirius-agent/tls/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Combined rate limiting + tunnel lookup (single access phase script)
    access_by_lua_file /opt/sirius-agent/lua/tunnel_lookup.lua;

    # Proxy to the configured upstream (administrator-defined, NEVER user-controlled)
    location / {
        # SECURITY: upstream is hardcoded from install-time configuration
        # Users CANNOT specify arbitrary upstream targets
        proxy_pass __UPSTREAM_URL__;
        proxy_ssl_verify off; # Upstream is internal/self-signed (Plesk)

        # Preserve original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Custom error pages for tunnel errors
    error_page 404 @tunnel_not_found;
    error_page 410 @tunnel_expired;
    error_page 429 @rate_limited;

    location @tunnel_not_found {
        default_type application/json;
        return 404 '{"error": "tunnel not found", "status": 404}';
    }

    location @tunnel_expired {
        default_type application/json;
        return 410 '{"error": "tunnel has expired", "status": 410}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"error": "rate limit exceeded", "status": 429}';
    }
}
