# API server block
# Proxies API requests to the Go backend
#
# Template variables (replaced by install.sh):
#   __BASE_DOMAIN__  — e.g., agent.example.com

# HTTP → HTTPS redirect for API
server {
    listen 80;
    listen [::]:80;
    server_name __BASE_DOMAIN__;

    # Allow ACME challenges for certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __BASE_DOMAIN__;

    # TLS certificate (wildcard covers the base domain too)
    ssl_certificate /etc/sirius-agent/tls/fullchain.pem;
    ssl_certificate_key /etc/sirius-agent/tls/privkey.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API endpoints → Go backend
    location /api/ {
        proxy_pass http://127.0.0.1:8181;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Root — return basic info
    location = / {
        default_type application/json;
        return 200 '{"service": "sirius-agent", "docs": "https://__BASE_DOMAIN__/api/health"}';
    }

    # Everything else — 404
    location / {
        default_type application/json;
        return 404 '{"error": "not found"}';
    }
}
