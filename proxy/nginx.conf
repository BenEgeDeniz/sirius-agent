# OpenResty main configuration
# BenEgeDeniz Sirius Agent — ephemeral reverse proxy system

worker_processes auto;
error_log /var/log/sirius-agent/nginx-error.log warn;
pid /run/openresty/openresty.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # Logging format with tunnel-relevant fields
    # Set default empty value for $subdomain (only populated in tunnel server block)
    map $host $subdomain_default {
        default "";
    }

    log_format tunnel_access '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'host="$host" '
                             'upstream_time="$upstream_response_time" '
                             'request_time="$request_time"';

    access_log /var/log/sirius-agent/nginx-access.log tunnel_access;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Lua shared dictionaries
    lua_shared_dict tunnel_cache 10m;
    lua_shared_dict rate_limit_store 10m;

    # Lua package path
    lua_package_path "/opt/sirius-agent/lua/?.lua;;";

    # Resolver — Tailscale MagicDNS + system DNS
    # 100.100.100.100 is Tailscale's MagicDNS resolver
    resolver 100.100.100.100 8.8.8.8 ipv6=off valid=30s;
    resolver_timeout 5s;

    # Security: hide server version
    server_tokens off;

    # SSL session settings (shared across server blocks)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP stapling (enable if your cert includes OCSP responder URL)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # Default server — reject requests with no matching Host
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;

        ssl_certificate /etc/sirius-agent/tls/fullchain.pem;
        ssl_certificate_key /etc/sirius-agent/tls/privkey.pem;

        server_name _;

        return 444; # Close connection without response
    }

    # Include site-specific configurations
    include /etc/sirius-agent/nginx/conf.d/*.conf;
}
